name: Deploy QazaqDos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qazaqdos-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: 31.76.11.212
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR="${QAZAQDOS_APP_DIR:-/var/www/qazaqdos}"
            REPO="https://github.com/bekbolatbekbergen1208/kazak-tili.git"

            echo "== host =="
            hostname
            echo "== app =="
            echo "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$USER":"$USER" "$APP_DIR"
              git clone "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"

            if [ -n "$(git status --porcelain)" ]; then
              echo "Refusing deploy: production working tree has local changes."
              git status --short
              exit 1
            fi

            git fetch origin main
            git checkout main
            git merge --ff-only origin/main

            npm ci
            npm run typecheck
            npm run training:dataset
            python3 training/validate_data.py
            npm test
            npm run build

            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe qazaqdos >/dev/null 2>&1; then
                pm2 restart qazaqdos --update-env
              elif pm2 describe kazaktili >/dev/null 2>&1; then
                pm2 restart kazaktili --update-env
              else
                PORT="${QAZAQDOS_PORT:-3010}"
                pm2 start npm --name qazaqdos -- start -- -p "$PORT"
                pm2 save
              fi
            else
              echo "PM2 is not installed. Build is ready, but process was not restarted."
              exit 2
            fi

            echo "== deploy complete =="
            pm2 ls
